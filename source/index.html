
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>十鼓員工排班系統</title>
<style>
body{font-family:Arial,sans-serif;background:#101827;color:white;margin:0;padding:24px}
main{max-width:420px;margin:50px auto}
h1{text-align:center;font-size:26px}
p{text-align:center;color:#aab6c7}
section{background:#1d293b;padding:24px;border-radius:16px}
input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:9px;font-size:16px}
input{border:1px solid #64748b;background:#fff;color:#111}
button{border:0;background:#20b981;color:#06291e;font-weight:bold}
nav{display:flex;gap:8px;margin-bottom:15px}
nav button{background:#334155;color:white}
nav button.active{background:#20b981;color:#06291e}
#message{min-height:24px}
</style>
</head>
<body>
<main>
<h1>十鼓員工排班系統</h1>
<p>員工填班・主管排班管理</p>
<section>
<nav>
<button id="employeeTab" class="active" onclick="switchTab('employee')">員工登入</button>
<button id="managerTab" onclick="switchTab('manager')">主管登入</button>
</nav>
<div id="employee">
<input id="code" placeholder="員工編號">
<input id="name" placeholder="員工姓名">
<button onclick="employeeLogin()">登入</button>
</div>
<div id="manager" hidden>
<input id="email" type="email" placeholder="主管 Email">
<input id="password" type="password" placeholder="主管密碼">
<button onclick="managerLogin()">登入</button>
</div>
<p id="message"></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient(
"https://uhaqhjozybjhgsbpcnku.supabase.co",
"sb_publishable_tB2cstpRYmFvTpanIe-haA_2EMHWnFS"
);
function show(s){document.getElementById("message").textContent=s}
function switchTab(t){
document.getElementById("employee").hidden=t!=="employee";
document.getElementById("manager").hidden=t!=="manager";
document.getElementById("employeeTab").classList.toggle("active",t==="employee");
document.getElementById("managerTab").classList.toggle("active",t==="manager");
show("");
}
async function employeeLogin(){
show("正在確認員工資料...");
const {data,error}=await db.rpc("employee_portal_login",{
p_employee_code:document.getElementById("code").value.trim(),
p_display_name:document.getElementById("name").value.trim()
});
show(error?"登入檢查失敗："+error.message:
data&&data.length?"員工資料核對成功，填班功能尚未開放":"員工編號或姓名不正確");
}
async function managerLogin(){
show("正在登入...");
const {data,error}=await db.auth.signInWithPassword({
email:document.getElementById("email").value.trim(),
password:document.getElementById("password").value
});
if(error){show("登入失敗："+error.message);return}
const {data:profile,error:pe}=await db.from("profiles").select("role,active").eq("id",data.user.id).single();
if(pe||profile?.role!=="manager"||!profile?.active){
await db.auth.signOut();
show("此帳號沒有主管權限");
return;
}
show("主管登入成功！管理功能即將加入。");
}
</script>
</body>
</html>
